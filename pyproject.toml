[project]
name = "viva-maboss"
version = "0.1.1"
description = "Process-bigraph wrapper for MaBoSS: stochastic Boolean network simulation (cmaboss)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Runtime dependencies are only what the simulation path imports, so the package installs into compose-api's composed
# environment (process-bigraph 1.9.1, bigraph-schema 1.8.1) without the dashboard stack. The dashboard is the
# `dashboard` extra.
dependencies = [
    "process-bigraph>=1.9.1",
    "bigraph-schema>=1.8.1",
    # MaBoSS's Python engine, built and published to PyPI by maboss-bkmc/MaBoSS's own workflow from engine/python
    # (BSD-3-Clause; the wheel's metadata omits the licence). A beta, so pinned exactly.
    "cmaboss==1.0.0b34",
    # cmaboss imports numpy without declaring it.
    "numpy",
    # the viva-maboss console script
    "typer",
    "rich",
]

[project.optional-dependencies]
# The workspace dashboard (`vivarium-workbench serve`, scripts/serve.sh), reports and visualizations. The container
# image installs it through the default `workbench` group below.
dashboard = [
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "vivarium-workbench",
]
# CI installs `.[dev]` (workspace-ci.yml), which needs the workspace lint and the dashboard tooling too.
dev = ["viva-maboss[dashboard]", "pytest>=7.4"]
cli = ["typer", "rich"]

# The image's `uv sync` installs default groups, not extras, so this group carries the dashboard extra into the
# image (viva-template v0.1.0's pattern); groups are not package metadata, so `pip install viva-maboss` stays lean.
[dependency-groups]
workbench = ["viva-maboss[dashboard]"]

[tool.uv]
default-groups = ["workbench"]

[project.scripts]
viva-maboss = "viva_maboss.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).
[tool.hatch.build.targets.wheel]
packages = ["viva_maboss"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
